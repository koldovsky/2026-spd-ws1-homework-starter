# owner: @evgenyadev · why: autonomy levels in docs/ai/team-agreement.md rest on checks that run every time, independent of the agent · review-by: 2027-02-20
name: CI

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run hook:test
      - run: npm run harness:check
